<!-- Taller 4, p.7 del PDF: añadir ion-menu-button en la cabecera -->
<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Exit</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <ion-card>
    <ion-card-header>
      <ion-card-title>Are you sure you want to close this app?</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <div class="buttons-container">
        <!-- Botón YES: type primary, invoca exitApp() -->
        <ion-button color="primary" (click)="exitApp()">YES</ion-button>
        <!-- Botón NO: type danger, navega a /tabs/wiki -->
        <ion-button color="danger" (click)="navigateToWiki()">NO</ion-button>
      </div>
    </ion-card-content>
  </ion-card>

</ion-content>
