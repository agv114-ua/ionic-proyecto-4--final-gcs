<!--
  Taller 4, p.18 del PDF + mejoras:
  - ion-refresher: pull-to-refresh
  - ion-item-sliding: deslizar para eliminar un favorito
-->
<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button aria-label="Abrir menu lateral"></ion-menu-button>
    </ion-buttons>
    <ion-title>My Favorites</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content
      pulling-text="Pull to refresh"
      refreshing-spinner="crescent"
      refreshing-text="Refreshing...">
    </ion-refresher-content>
  </ion-refresher>

  <!-- Estado vacio -->
  <div class="empty-state" *ngIf="favorites.length === 0">
    <ion-icon name="star-outline" size="large" aria-hidden="true"></ion-icon>
    <p>No favorites yet.</p>
  </div>

  <ion-list *ngIf="favorites.length > 0">
    <ion-item-sliding *ngFor="let fav of favorites; let i = index">
      <ion-item [href]="generateURL(fav.category, fav.id)">
        <ion-icon slot="start" name="star" color="warning" aria-hidden="true"></ion-icon>
        <ion-label>
          {{ fav.name }} <ion-text color="medium">({{ fav.category }})</ion-text>
        </ion-label>
      </ion-item>
      <ion-item-options side="end">
        <ion-item-option color="danger" (click)="removeFavorite(i)" aria-label="Quitar de favoritos">
          <ion-icon slot="icon-only" name="trash" aria-hidden="true"></ion-icon>
        </ion-item-option>
      </ion-item-options>
    </ion-item-sliding>
  </ion-list>

</ion-content>
