<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>About</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <ion-card>

    <!-- Logo Star Wars centrado en la parte superior -->
    <div class="logo-container">
      <img
        class="sw-logo"
        src="../../assets/images/categories/sw.png"
        alt="Star Wars Logo"
      />
    </div>

    <ion-card-header>
      <ion-card-title>Wiki Star Wars, ver 1.0</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <!-- Párrafo descriptivo de la App -->
      <p>
        Wiki Star Wars is your ultimate reference guide to the galaxy far, far
        away. Browse characters, planets, species and starships from the entire
        Star Wars universe, all powered by the open SWAPI data API.
      </p>

      <!-- Copyright más pequeño y alineado a la derecha -->
      <p class="copyright">
        &copy; 2024 Gestión de la Calidad del Software, INC.
      </p>
    </ion-card-content>

  </ion-card>

</ion-content>
