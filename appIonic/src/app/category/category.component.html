<!--
  Plantilla del CategoryComponent (Taller 2, Parte 1 p.12 y Parte 2 p.24 del PDF).
  Mejoras: buscador (ion-searchbar) + mensaje cuando no hay resultados.
-->
<ion-item>
  <ion-avatar slot="start">
    <img
      [src]="'../../assets/images/categories/' + theCategory.image"
      [alt]="'Imagen de la categoria ' + theCategory.name"
    />
  </ion-avatar>
  <ion-label>
    <h2>{{ theCategory.name }}</h2>
  </ion-label>
  <ion-button slot="end" (click)="click()" [attr.aria-label]="'Ver articulos de ' + theCategory.name">
    <ion-icon slot="icon-only" name="eye" aria-hidden="true"></ion-icon>
  </ion-button>
</ion-item>

<!--
  Lista de articulos: solo si la categoria esta seleccionada (*ngIf="selected").
  Taller 3, Parte 1, p.5 del PDF: cada articulo es clicable y navega a la pagina
  'article' con su categoria y uid en la URL ([href]="generateURL(...)").
-->
<div *ngIf="selected">
  <ion-searchbar
    placeholder="Search by name"
    [debounce]="200"
    (ionInput)="onSearch($event)"
    aria-label="Buscar articulos por nombre">
  </ion-searchbar>

  <ion-list *ngIf="filteredArticles.length > 0">
    <ion-item
      *ngFor="let article of filteredArticles"
      [href]="generateURL(theCategory.name, article.uid)">
      {{ article.name }}
    </ion-item>
  </ion-list>

  <ion-item *ngIf="filteredArticles.length === 0" lines="none">
    <ion-label color="medium">No results.</ion-label>
  </ion-item>
</div>
