<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Wiki Star Wars</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <ion-list-header>
    <ion-label size="large">Categories</ion-label>
  </ion-list-header>

  <ion-list>
    <!--
      Taller 2, Parte 1, p.14 del PDF:
      Sustituimos el <ion-item> que contenia el *ngFor por <app-category>.
      - [theCategory]="cat"                  => Input binding (p.11)
      - [selected]="selectedCategory==cat.name" => Input binding (p.14)
      - (clicked)="selectCategory($event)"   => captura del @Output emitido por el hijo (p.14)
    -->
    <app-category
      *ngFor="let cat of categories"
      [theCategory]="cat"
      [selected]="selectedCategory == cat.name"
      (clicked)="selectCategory($event)">
    </app-category>
  </ion-list>

</ion-content>
